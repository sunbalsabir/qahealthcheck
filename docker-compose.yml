# Local infrastructure for Qualovix QA Auditor.
#   docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: qualovix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: qualovix
      POSTGRES_PASSWORD: qualovix
      POSTGRES_DB: qualovix_auditor
    ports:
      - "5432:5432"
    volumes:
      - qualovix-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qualovix -d qualovix_auditor"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: qualovix-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - qualovix-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  qualovix-postgres-data:
  qualovix-redis-data:
